	ra|rules/defaults.yaml
	ra|rules/vehicles.yaml
	ra|rules/husks.yaml
	ra|rules/structures.yaml
	ra|rules/infantry.yaml
	ra|rules/civilian.yaml
	ra|rules/decoration.yaml
