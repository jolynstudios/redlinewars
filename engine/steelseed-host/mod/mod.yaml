	ra|rules/ships.yaml
	ra|rules/fakes.yaml
	ra|rules/map-generators.yaml
	ra|rules/assetless-presentation.yaml
	ra|rules/deployment-rules.yaml

Sequences:
	ra|sequences/ships.yaml
	ra|sequences/vehicles.yaml
	ra|sequences/structures.yaml
	ra|sequences/infantry.yaml
	ra|sequences/aircraft.yaml
	ra|sequences/misc.yaml
	ra|sequences/decorations.yaml

TileSets:
	ra|tilesets/snow.yaml
	ra|tilesets/interior.yaml
	ra|tilesets/temperat.yaml
	ra|tilesets/desert.yaml

FluentMessages:
	ra|fluent/ra.ftl
	ra|fluent/rules.ftl
	ra|fluent/host.ftl

Weapons:
	ra|weapons/explosions.yaml
	ra|weapons/ballistics.yaml
	ra|weapons/missiles.yaml
	ra|weapons/other.yaml
	ra|weapons/smallcaliber.yaml
	ra|weapons/superweapons.yaml

Notifications:
	ra|notifications.yaml

Cursors:
	ra|cursors.yaml

ChromeMetrics:
	ra|metrics.yaml

Assemblies: OpenRA.Mods.Common.dll, OpenRA.Mods.Cnc.dll, OpenRA.Mods.Steelseed.dll

LoadScreen: SteelseedLoadScreen

ServerTraits:
	LobbyCommands
	SkirmishLogic
	PlayerPinger

DefaultOrderGenerator: AssetlessOrderGenerator

Fonts:

SoundFormats:

