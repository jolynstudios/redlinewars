	Valued:
		Cost: 2000
	Buildable:
		# Removal, not an empty override. `^foundry_structure` / `^lattice_structure` set
		# `Prerequisites: <the HQ itself>` because every other building needs the HQ; an
		# empty `Prerequisites:` does NOT clear an inherited node in MiniYAML, so the HQ
		# ended up requiring itself and ProductionQueue silently rejected StartProduction
