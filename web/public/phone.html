<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>REDLINE WARS · Play on desktop or tablet</title>
		<meta name="robots" content="noindex" />
		<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
		<!-- Self-contained like the game page (rules 4/13): no external font, stylesheet, image or script. -->
		<style>
			:root { color-scheme: dark; --ink: #e9edf1; --dim: #9aa6b2; --red: #d8453b; --bg: #090d11; --panel: #121820; --line: #273241; }
			* { box-sizing: border-box; }
			html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
			body { display: grid; place-items: center; min-height: 100svh; padding: 24px 16px;
				font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
			main { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--red); padding: 28px 22px; }
			.label { margin: 0 0 12px; color: var(--red); font: 600 11px/1.4 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; }
			h1 { margin: 0 0 14px; font-size: 26px; line-height: 1.15; letter-spacing: .01em; }
			p { margin: 0 0 14px; color: var(--dim); }
			a.button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 8px; padding: 0 18px;
				border: 1px solid var(--red); color: #fff; background: var(--red); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
			a.button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
		</style>
	</head>
	<body>
		<main>
			<p class="label">Redline Wars · Fractured Order</p>
			<h1>Made for desktop and tablet</h1>
			<p>A real-time battle needs more screen than a phone has. Open <strong>redlinewars.online</strong> on a computer, laptop or tablet to play, free, right in the browser.</p>
			<p>Tablets work with touch: tap to select, drag to command.</p>
			<a class="button" href="https://www.redlinewars.online/">Back to the site</a>
		</main>
	</body>
</html>
